# Living-room display audio tuning for the Yoga Book (Cherry Trail SST).
#
# - The rt5677/SST speaker device underruns with PipeWire's default headroom
#   of 0 (ERR counter in pw-top keeps climbing); give it slack.
# - Bluetooth audio from a phone (bluez_input.*) arrives irregularly; a larger
#   buffer (~85 ms) stops the "client missed wakeups" dropouts that made music
#   sound robotic. Latency does not matter for music playback.
# - Codecs: SBC (and AAC if a build ever ships it; Ubuntu's does not). A
#   Pixel otherwise picks aptX HD (576 kbit/s, no error recovery), which
#   stalls for ~1 s whenever the shared Wi-Fi/Bluetooth radio is busy; SBC
#   (what the iPhone gets too) plays through.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-cht-yogabook.*" } ]
    actions = { update-props = { api.alsa.headroom = 2048 } }
  }
]
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_input.*" } ]
    actions = { update-props = { node.latency = "4096/48000" } }
  }
]
monitor.bluez.properties = {
  bluez5.codecs = [ aac sbc_xq sbc ]
}
