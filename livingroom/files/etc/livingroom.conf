# Living-room display settings (read at start).
# Weather location: leave empty to detect from the IP address, or set a city
# name, or exact coordinates.
city =
lat =
lon =
# celsius or fahrenheit
units = celsius
# 24-hour clock (yes/no)
clock24 = yes
# Scene: auto, autumn, snow, sakura, fireflies, rain or mountains
# ("auto" = rain when it rains, otherwise by season). Tapping the screen
# and picking a scene overrides this.
theme = auto
# Paintings: each scene shows one of /opt/livingroom/scenes/<scene>/*.jpg or
# your own images in ~livingroom/Pictures/Living Room/<scene>/ (changes every
# 20 minutes).
# Weather: card (full card), compact (one line under the date) or off.
# Tapping the screen and using the Weather button overrides this.
weather = card

# --- Screen power (livingroom-power; changes apply within a second) ---
# Easiest: tap the screen -> 🌙 Screen. What you set there is saved in
# ~livingroom/.config/livingroom/power.json and replaces screen, sleep_after,
# wake_on and the schedule lines below (delete that file to use these again).
# screen: auto  = sleep after `sleep_after` minutes without a touch, wake on
#                 touch or the wake_on sensors
#         on    = always on
#         sleep = dark; a touch (or the wake_on sensors) wakes it for
#                 `sleep_after` minutes
# It never sleeps while another device is connected: a Bluetooth phone, an
# AirPlay/DLNA sender, or a cast/laptop screen being shown.
screen = auto
# minutes (0 = never sleep)
sleep_after = 10
# what wakes a dark screen besides touch: camera, light (both), or none.
# camera: motion in front of the tablet (the camera runs only while the
# screen is dark, ~20 % of one core); light: the room lights change.
wake_on = camera light
# which camera faces the room: front or rear
camera = front
# % of the picture that must change to count as motion (lower = more
# sensitive), and % change in room light
camera_sensitivity = 3
light_sensitivity = 30
# Schedules override `screen` while they run; add as many as you like, the
# last matching line wins. Format:
#   schedule = <days> <HH:MM>-<HH:MM> <on|auto|sleep> [wake_on=camera,light|none]
# days: daily, weekdays, weekends, mon-fri, sat,sun, tue ... A range past
# midnight belongs to its first day. A sleep schedule wakes by touch only
# unless it has wake_on=. Examples:
#   schedule = daily 23:30-06:30 sleep
#   schedule = weekdays 07:00-09:00 on
#   schedule = weekends 08:00-23:00 auto
#   schedule = weekdays 09:30-17:30 sleep wake_on=camera
