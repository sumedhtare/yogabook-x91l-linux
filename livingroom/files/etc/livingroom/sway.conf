# sway as a kiosk compositor for the Living Room session. (cage 0.2.1 crashes
# with "wlr_xdg_surface_schedule_configure: Assertion surface->initialized"
# whenever a second window appears - the AirPlay/DLNA video windows.)

# Panel is portrait-native (1200x1920), mounted "right side up"; wlroots ignores
# the panel-orientation quirk. sway counts transforms clockwise (wlr-randr/cage:
# counter-clockwise), so this is wlr-randr's "90".
# Touch is rotated separately (udev LIBINPUT_CALIBRATION_MATRIX).
output DSI-1 transform 270 bg #000000 solid_color
input type:touch map_to_output DSI-1

# Every window full screen, no decorations, no cursor.
default_border none
default_floating_border none
for_window [app_id=".*"] fullscreen enable
for_window [class=".*"] fullscreen enable
seat * hide_cursor 1000
focus_follows_mouse no

# No key bindings, no bar, no idle blanking: it is a wall display.
exec /usr/local/bin/livingroom-kiosk
